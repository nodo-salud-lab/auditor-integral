# SQLite (CREATE nueva → INSERT … SELECT → DROP vieja → RENAME) cuando ninguna migración declara tablas hijas con
# ON DELETE CASCADE/SET NULL/SET DEFAULT hacia la tabla vieja; si las hay, el DROP sigue en DAT-MIGRACIONES-SEGURAS
# (drop_table, alta). Aquí queda visible cada reconstrucción omitida (reconstruccion_sqlite, info). Gate N5 y
# severidad info: no bloquea ni baja el nivel potencial de N1-N4; nunca pasa (que no haya reconstrucciones no prueba
# nada y migraciones_sql es parcial).
