[[control]]
id = "SEG-BFLA"
titulo = "Autorización por función: rutas de administración protegidas en el servidor; sin /admin público"
titulo_dueno = "Hay rutas de administración o de depuración abiertas sin verificar quién entra"
accion_dueno = "Protege en el servidor cada ruta de administración o depuración con inicio de sesión y rol, o elimínala del despliegue."
alias = ["SEC-11", "VC-23"]
dominio = "SEG"
etapa = "E2"
gate = "N2"
