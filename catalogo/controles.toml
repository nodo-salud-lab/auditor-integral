# Catálogo canónico de controles de auditor-integral (fuente única de verdad).
#
# Formato: PLAN_MAESTRO.md §3.5. Gates según la tabla §4.3 (vista resumida).
# Construido deduplicando los checks de los informes 01-08 (lista completa en
# alias_fuente.json) sobre la base del catálogo de 09-diseno-B §7.
#
# Convenciones:
#   - alias: IDs de origen (VC/SEC/DB/INF/UX/ING/ECO/GAP). Cada alias está en un solo control.
#   - condicion: expresión sobre las banderas de perfil.json (ver perfil_riesgo.toml):
#     "siempre" | bandera | bandera ==/!=/</<=/>/>= literal, con and / or / not y paréntesis.
#     Bandera sin respuesta (null) = condición desconocida: el control queda aplicable y,
#     si no se puede evaluar, sale no_evaluado (no se asume la respuesta).
#   - mapea_reglas: "herramienta:regla" con comodines fnmatch; gana el patrón más específico
#     (más caracteres literales). Convenciones de regla de los normalizadores:
#       gitleaks-bundle:<regla>  hallazgo de gitleaks en dist/, build/, .next/ u out/
#       osv:<severidad>/<id>     severidad en minúsculas: critica | alta | media | baja
#       check:<script>.<clave>   chequeos propios de scripts/checks/
#       axe:<impacto>/<regla>    lint:<plugin>/<regla>   k6:<escenario>
#   - evidencia_pass (sin «pases vacíos»; cada control justifica su elección en «# evidencia_pass: …»):
#       "ausencia_suficiente"     la herramienta cubre el control completo y su ausencia de hallazgos es evidencia,
#                                 con precondición de alcance: alcance_requerido = ["herramienta.clave"] (meta.alcance
#                                 ≥ 1 objeto analizado). Alcance 0 → sin_alcance (no_aplica | no_evaluado) con
#                                 motivo_sin_alcance. Sin alcance registrado → no_evaluado (fail-closed).
#       "checks_pass"             solo pasa con un pase explícito en checks_pass (default si falta el campo).
#       "no_demostrable_estatico" no pasa en análisis estático: no_evaluado («requiere juicio LLM / sonda dinámica /
#                                 entrevista»; lo resuelven F3 revisores, F4 sondas o la entrevista).
#     En las tres categorías los hallazgos siguen dando fail. Ver scripts/estado.py.
#   - severidad_base y esfuerzo: ESTIMACIÓN (propuesta; los decide el investigador).
#   - Los controles legales de OPS no bloquean el nivel global (DECISIONES.md #4).
#   - Un mismo nombre en dos niveles de §4.3 se separa en dos controles (p. ej. INF-ENTORNOS
#     y INF-ENTORNOS-SEPARADOS). DAT-RLS-ON tiene gate N2 y perfil_riesgo.toml lo baja a N1
#     cuando hay datos reales cargados.


# ======================================================================
# SEG — Seguridad
# ======================================================================

[[control]]
id = "SEG-SECRETO-REPO"
titulo = "Sin secretos en el working tree ni en el historial git"
titulo_dueno = "Hay claves secretas guardadas dentro del proyecto"
accion_dueno = "Cambia cada clave en su servicio hoy mismo y después sácala del proyecto."
alias = ["VC-04", "SEC-01", "ECO-02", "INF-03"]
dominio = "SEG"
etapa = "E2"
gate = "N1"
severidad_base = "critica"
metodo = "determinista"
herramientas = ["gitleaks", "trufflehog"]
condicion = "siempre"
bloquea_global = true
mapea_reglas = ["gitleaks:*", "semgrep:generic.secrets.*", "check:dockerfile.secreto_en_env", "check:iac.tf_secreto_literal", "check:archivos_clave.secreto_en_env"]
# Ronda 3 (h_env): gitleaks no reconoce contraseñas de nombre genérico (DB_PASSWORD=…) ni JWT de Supabase con role service_role en .env; archivos_clave.secreto_en_env los reporta (sin copiar el valor) y da fail. No emite pase: el pass sigue saliendo de gitleaks.
# evidencia_pass: gitleaks recorre working tree e historial con reglas propias (sin .gitleaks.toml del repo): su ausencia de hallazgos con ≥ 1 archivo escaneado es la evidencia que pide el control. Ronda 1: en un repo git con commits también exige el historial escaneado (alcance_condicional); sin repo git basta el árbol.
evidencia_pass = "ausencia_suficiente"
alcance_requerido = ["gitleaks.arbol"]
alcance_condicional = [{requiere = "gitleaks.historial", si = "gitleaks.commits", motivo = "repositorio git con historial: el control también exige escanear el historial"}]
alcance_excluyente = [{clave = "gitleaks.codigo_confidencial", motivo = "hay código o archivos .env en rutas confidenciales (config/confidencial.toml, p. ej. src/patients/) que gitleaks no escanea: la ausencia de hallazgos no los cubre (ronda 4, PV-R3-01)"}]
sin_alcance = "no_evaluado"
motivo_sin_alcance = "sin archivos que escanear en el working tree"
esfuerzo = "S"
fuente = "investigacion/01-fallas-ia-vibecoding.md (VC-04); investigacion/02-seguridad.md (SEC-01); investigacion/04-infra-escalabilidad-carga.md (INF-03); investigacion/07-repos-skills-expertos.md (ECO-02)"

[[control]]
id = "SEG-SECRETO-BUNDLE"
titulo = "Sin claves privilegiadas (service_role, sk_live, AKIA) en el build del cliente (dist, build, .next, out)"
titulo_dueno = "Hay claves con permisos amplios dentro de lo que descarga el navegador"
accion_dueno = "Cambia esas claves en su servicio hoy mismo, muévelas al servidor y vuelve a construir la app."
alias = ["VC-05", "SEC-02", "DB-05", "ECO-06"]
dominio = "SEG"
etapa = "E2"
gate = "N1"
severidad_base = "critica"
metodo = "determinista"
herramientas = ["gitleaks", "semgrep"]
# semgrep solo cubre service_role en el código del cliente: sus hallazgos dan fail, pero sin gitleaks
# (que escanea dist/ build/ .next/ out/) el control no puede pasar (corrección post-verificación).
herramientas_parciales = ["semgrep"]
condicion = "siempre"
bloquea_global = true
# D39 (10-f0-f1-resultados §6.1): service_role leída desde una variable pública en el CÓDIGO FUENTE va a
# SEG-AUTH-CLIENTE; aquí solo cuenta si el archivo es de build (dist/ build/ .next/ out/ → "<herr>-bundle:").
mapea_reglas = ["gitleaks-bundle:*", "semgrep-bundle:vibe-coding.service-role-cliente"]
# evidencia_pass: gitleaks escanea dist/ build/ .next/ out/ aunque estén ignorados: la ausencia vale solo si escaneó ≥ 1 carpeta de bundle; sin bundle el control no aplica (semgrep es parcial).
evidencia_pass = "ausencia_suficiente"
alcance_requerido = ["gitleaks.bundles"]
sin_alcance = "no_aplica"
motivo_sin_alcance = "sin bundle"
esfuerzo = "S"
fuente = "investigacion/01-fallas-ia-vibecoding.md (VC-05); investigacion/02-seguridad.md (SEC-02); investigacion/03-bases-de-datos.md (DB-05); investigacion/07-repos-skills-expertos.md (ECO-06)"

[[control]]
id = "SEG-SECRETO-LOCAL"
titulo = "Secretos locales no versionados (ignorados por git) y claves públicas por diseño (JWT anon) fuera del repo y del build"
titulo_dueno = "Hay claves en archivos locales que git ignora"
accion_dueno = "Revisa que esos archivos sigan fuera del repositorio y que ningún build los copie a lo publicado."
# Ronda 6 (DECISIONES.md #12): gitleaks (normalizar/gitleaks.py) etiqueta como «secreto-local-ignorado:<regla>» los
# hallazgos en archivos ignorados por git y nunca versionados, y como «jwt-anon-publico:<regla>» los JWT con role anon
# (clave pública por diseño de Supabase); archivos_clave hace lo mismo con secreto_en_env_local (.env ignorado y sin
# historial). Antes iban a SEG-SECRETO-REPO/BUNDLE (críticos, bloquean el global, «rotar + filter-repo»). Aquí siguen
# visibles con severidad baja, sin bloqueo, y la remediación no pide rotar. Por especificidad del patrón ganan sobre
# gitleaks:* y gitleaks-bundle:*. service_role, otros roles, JWT ilegibles y secretos versionados, sin seguimiento o
# ignorados con historial siguen en SEG-SECRETO-REPO/BUNDLE (fail-closed).
alias = []
dominio = "SEG"
etapa = "E2"
gate = "N3"
severidad_base = "baja"
metodo = "determinista"
herramientas = ["gitleaks", "archivos_clave"]
herramientas_parciales = ["archivos_clave"]
condicion = "siempre"
bloquea_global = false
mapea_reglas = ["gitleaks:secreto-local-ignorado:*", "gitleaks:jwt-anon-publico:*", "gitleaks-bundle:jwt-anon-publico:*", "gitleaks-bundle:secreto-local-ignorado:*", "check:archivos_clave.secreto_en_env_local"]
# evidencia_pass: gitleaks escanea el working tree y, aparte y con presupuesto propio, las carpetas ignoradas por git: su ausencia de hallazgos vale solo con ≥ 1 archivo escaneado y si no quedó ninguna carpeta ignorada sin escanear (gitleaks.ignoradas_pendientes, alcance_excluyente); archivos_clave es parcial.
evidencia_pass = "ausencia_suficiente"
alcance_requerido = ["gitleaks.arbol"]
alcance_excluyente = [{clave = "gitleaks.ignoradas_pendientes", motivo = "quedaron carpetas ignoradas por git sin escanear (presupuesto agotado o error): la ausencia de hallazgos no las cubre"}]
sin_alcance = "no_evaluado"
motivo_sin_alcance = "sin archivos que escanear en el working tree"
esfuerzo = "S"
fuente = "DECISIONES.md #12 (ronda 6); investigacion/02-seguridad.md (SEC-01)"

[[control]]
id = "SEG-ENV-PUBLICAS"
titulo = "Variables VITE_/NEXT_PUBLIC_/EXPO_PUBLIC_ sin nombres ni valores sensibles"
titulo_dueno = "Una clave secreta quedaría visible para cualquier visitante del sitio"
accion_dueno = "Quita el prefijo público (NEXT_PUBLIC_, VITE_, EXPO_PUBLIC_) a esa variable, úsala solo en el servidor y cámbiala en su servicio."
alias = ["VC-06"]
dominio = "SEG"
etapa = "E2"
gate = "N1"
severidad_base = "critica"
metodo = "determinista"
herramientas = ["env_publicas"]
condicion = "siempre"
bloquea_global = true
mapea_reglas = ["check:env_publicas", "check:env_publicas.*"]
# evidencia_pass: check propio (env_publicas): emite un pase explícito (check:env_publicas…) solo si analizó ≥ 1 archivo .env* o código que lee variables de entorno (ronda 1); si no hay nada de eso queda no_aplica con motivo.
evidencia_pass = "checks_pass"
esfuerzo = "S"
fuente = "investigacion/01-fallas-ia-vibecoding.md (VC-06)"

[[control]]
id = "SEG-ENV-EJEMPLO"
titulo = ".env ignorado por git y .env.example sin valores reales"
titulo_dueno = "La configuración (`.env`) no está documentada ni protegida como corresponde"
accion_dueno = "Crea `.env.example` con los nombres de las variables y valores inventados, y saca `.env` del repositorio si está ahí."
alias = ["SEC-03", "ING-08"]
dominio = "SEG"
etapa = "E2"
gate = "N1"
severidad_base = "alta"
metodo = "determinista"
herramientas = ["archivos_clave"]
condicion = "siempre"
bloquea_global = false
mapea_reglas = ["check:archivos_clave.env_*"]
# evidencia_pass: check propio (archivos_clave): emite un pase explícito (check:archivos_clave.env_*…) cuando verifica la condición; que solo corra no basta.
evidencia_pass = "checks_pass"
esfuerzo = "S"
fuente = "investigacion/02-seguridad.md (SEC-03); investigacion/06-ingenieria-software-ciclo.md (ING-08)"

[[control]]
id = "SEG-LLM-CLAVE"
