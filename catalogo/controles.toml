etapa = "E2"
gate = "N5"
severidad_base = "info"
metodo = "determinista"
herramientas = ["migraciones_sql"]
herramientas_parciales = ["migraciones_sql"]
# Todas sus herramientas son parciales (fallbacks): permitido solo con evidencia_pass = no_demostrable_estatico
