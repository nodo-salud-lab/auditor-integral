[[control]]
id = "SEG-DEPS-EXISTEN"
titulo = "Dependencias existentes en el registro, con antigüedad mínima y sin typosquat (anti-slopsquatting)"
titulo_dueno = "Alguna librería del proyecto podría no existir o ser una imitación"
accion_dueno = "Revisa en el registro oficial que cada librería exista y sea la esperada, y elimina las dudosas."
