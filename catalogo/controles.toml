[[control]]
id = "DAT-SQL-CONCATENADO"
titulo = "Sin SQL concatenado con entrada del usuario"
titulo_dueno = "Una búsqueda arma la consulta a la base de datos pegando lo que escribe el usuario"
accion_dueno = "Reemplaza esa consulta por una con parámetros."
alias = ["DB-08"]
dominio = "DAT"
etapa = "E2"
gate = "N1"
severidad_base = "critica"
metodo = "determinista"
herramientas = ["semgrep"]
condicion = "siempre"
bloquea_global = true
mapea_reglas = ["semgrep:vibe-coding.sql-concatenado", "semgrep:*sqli*", "semgrep:*sql-injection*", "semgrep:*tainted-sql*"]
# evidencia_pass: propiedad sintáctica (SQL armado por concatenación/plantilla) que las reglas sqli/tainted-sql + vibe-coding.sql-concatenado buscan directamente; exige ≥ 1 archivo fuente escaneado por semgrep CON consultas SQL (alcance consultas_sql, ronda 1). Sin SQL en el código → no_aplica. Se usa el alcance y no la condición bd == true: con una condición falsa un hallazgo quedaría oculto como no_aplica, mientras que un hallazgo siempre da fail antes de mirar el alcance.
evidencia_pass = "ausencia_suficiente"
alcance_requerido = ["semgrep.consultas_sql"]
# Ronda 2: consultas SQL en código sin reglas sqli/tainted-sql en el ruleset cargado (p. ej. FastAPI/psycopg2, sqlite3, Kotlin) bloquean el pass.
alcance_excluyente = [{clave = "semgrep.consultas_sql_sin_reglas", motivo = "hay consultas SQL en código escaneado sin reglas de inyección SQL en los rulesets cargados (p. ej. Python sin Flask/Django, DB-API directo, Kotlin): la ausencia de hallazgos no lo cubre"}, {clave = "semgrep.fuentes_no_escaneadas", motivo = "hay código de aplicación que semgrep no escaneó (rutas confidenciales o archivos > 2 MB): podría tener consultas SQL y la ausencia de hallazgos no lo cubre (ronda 4, PV-R3-01/04)"}]
sin_alcance = "no_aplica"
motivo_sin_alcance = "sin consultas SQL en el código fuente escaneado"
esfuerzo = "S"
fuente = "investigacion/03-bases-de-datos.md (DB-08)"


[[control]]
id = "DAT-PII-REPO"
titulo = "Datos personales o de salud versionados en el repositorio"
titulo_dueno = "Hay datos personales o de salud guardados en el proyecto"
accion_dueno = "Saca ese archivo del proyecto y reemplázalo por datos inventados."
# DECISIONES.md #3 (generalizada): carpetas y archivos de config/confidencial.toml. El chequeo usa solo
# metadatos (git ls-files, lstat); la evidencia es ruta y conteo, nunca contenido.
alias = []
dominio = "DAT"
etapa = "E2"
gate = "N1"
severidad_base = "critica"
metodo = "determinista"
herramientas = ["datos_confidenciales"]
condicion = "siempre"
bloquea_global = true
mapea_reglas = ["check:datos_confidenciales.trackeado*", "check:datos_confidenciales.no_trackeado", "check:datos_confidenciales.pii_tabular"]
# Ronda 6 (DECISIONES.md #12): config/confidencial.toml separa carpetas inequívocas (datos-reales, data/raw…: todo su
# contenido es confidencial) y ambiguas (pacientes, patients: solo los archivos de datos; el código se escanea). Un YAML o
# JSON es tabular solo con ≥ 2 registros con claves comunes; los correos de dominios reservados (RFC 2606/6761) y los
# buzones de sistema no cuentan como PII. La PII en carpetas de test o fixture va a DAT-PII-TEST (pii_en_test).
# Ronda 3 (PV-R2-01): que ningún NOMBRE coincida con los patrones no prueba que no haya datos personales versionados. datos_confidenciales inspecciona además los archivos de datos versionados (CSV/TSV: encabezado y una muestra de filas; JSON/JSONL: claves de los registros) y reporta pii_tabular (crítico) por columnas o valores personales o de salud, sin copiar ningún valor; un archivo de datos binario (xlsx, sav, sqlite…) no inspeccionable impide el pase no_trackeado.
# evidencia_pass: check propio (datos_confidenciales): pase explícito no_trackeado (ronda 1) solo en un repositorio git y si evaluó ≥ 1 objeto: candidatos confidenciales locales/versionados o, sin candidatos, ≥ 1 archivo versionado contrastado con los patrones. Sin repositorio git → no_aplica (nada está versionado; el control trata del repositorio); repo sin archivos versionados ni candidatos → no_aplica.
# Ronda 9 (DECISIONES.md #13): detectar PII por patrones nunca es completo (formatos, codificaciones, anidamientos y
# ofuscaciones siempre dejan huecos), así que la ausencia de hallazgos NO demuestra ausencia de datos personales. El
# control nunca da pass en análisis estático: sin hallazgos queda no_evaluado («no se detectaron datos personales; no
# demostrable»). El check sigue emitiendo el pase interno no_trackeado (informativo) y los hallazgos siguen dando fail.
evidencia_pass = "no_demostrable_estatico"
motivo_no_demostrable = "sin datos personales detectados; la detección por patrones no es exhaustiva y no lo demuestra (revisión humana)"
esfuerzo = "S"
fuente = "DECISIONES.md #3; Ley 19.628 y Ley 20.584 (señal de riesgo, no afirmación de cumplimiento)"
[[control]]
id = "DAT-PII-TEST"
titulo = "Datos con forma de PII en tests o fixtures verificados como ficticios"
# Ronda 6 (DECISIONES.md #12): datos_confidenciales emite pii_en_test (severidad media) cuando un archivo de test o
# fixture parece tener datos personales. Sigue visible y sin pase, pero no es crítico ni bloquea el global como
# DAT-PII-REPO: lo habitual son datos ficticios, y eso lo verifica una persona.
alias = []
dominio = "DAT"
etapa = "E2"
gate = "N2"
severidad_base = "media"
metodo = "determinista"
herramientas = ["datos_confidenciales"]
condicion = "siempre"
bloquea_global = false
# Ronda 7 (DECISIONES.md #12, adenda 2): también pii_no_tabular (media): valores con forma de email real o teléfono en un
# JSON/YAML versionado (o del historial) que no es lista de registros. Sin este mapeo el normalizador lo descartaría.
mapea_reglas = ["check:datos_confidenciales.pii_en_test", "check:datos_confidenciales.pii_no_tabular"]
# evidencia_pass: no_demostrable_estatico. Que el check no vea PII en tests no prueba que los datos sean ficticios, y su pase no_trackeado ya cuenta para DAT-PII-REPO; sin hallazgos queda no_evaluado, nunca pass.
evidencia_pass = "no_demostrable_estatico"
esfuerzo = "S"
fuente = "DECISIONES.md #12 (ronda 6); DECISIONES.md #3; Ley 19.628 (señal de riesgo, no afirmación de cumplimiento)"

