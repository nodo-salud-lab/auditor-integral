[[control]]
id = "SEG-DEPS-CVE-CRIT"
titulo = "Sin CVE críticos en dependencias de producción"
titulo_dueno = "Hay librerías con fallas graves conocidas"
accion_dueno = "Reemplaza esas librerías por una versión corregida y vuelve a generar el archivo de versiones (lockfile)."
alias = ["SEC-06"]
dominio = "SEG"
etapa = "E2"
gate = "N2"
severidad_base = "critica"
metodo = "determinista"
herramientas = ["osv-scanner", "trivy"]
condicion = "siempre"
bloquea_global = false
mapea_reglas = ["osv:critica/*"]
# evidencia_pass: osv-scanner contrasta cada versión resuelta del lockfile con OSV: con ≥ 1 lockfile, cero vulnerabilidades críticas es evidencia completa.
evidencia_pass = "ausencia_suficiente"
alcance_requerido = ["osv-scanner.lockfiles"]
alcance_excluyente = [{clave = "osv-scanner.lockfiles_confidenciales", motivo = "hay lockfiles en rutas confidenciales (config/confidencial.toml) cuyos resultados se descartan: la ausencia de avisos no los cubre (ronda 4, PV-R3-01)"}]
sin_alcance = "no_evaluado"
motivo_sin_alcance = "sin lockfile: osv no puede resolver versiones (ver SEG-LOCKFILE)"
esfuerzo = "M"
fuente = "investigacion/02-seguridad.md (SEC-06)"

[[control]]
id = "SEG-LOCKFILE"
titulo = "Lockfile comiteado, instalación reproducible en CI y hosts de registro permitidos"
titulo_dueno = "Falta el archivo que fija las versiones exactas de las librerías"
accion_dueno = "Agrega el archivo de versiones (lockfile) al repositorio e instala con el modo estricto (npm ci)."
alias = ["VC-11", "SEC-04"]
dominio = "SEG"
etapa = "E2"
gate = "N2"
severidad_base = "alta"
metodo = "determinista"
herramientas = ["archivos_clave", "lockfile-lint"]
condicion = "siempre"
bloquea_global = false
mapea_reglas = ["check:archivos_clave.lockfile*", "check:archivos_clave.lockfile_valido", "check:archivos_clave.lockfile_versionado", "check:archivos_clave.lockfile_ci", "check:archivos_clave.lockfile_hosts"]
# evidencia_pass: check propio (archivos_clave, lockfile-lint). Ronda 2: la mera existencia del archivo ya no basta; el título exige las tres partes y pases_requeridos las pide todas (AND): contenido válido (lockfile_valido; vacío → hallazgo lockfile_vacio), versionado en git (lockfile_versionado), instalación reproducible en un CI de push/PR (lockfile_ci: npm ci, --frozen-lockfile, --immutable, uv sync --locked…) y hosts de registro permitidos (lockfile_hosts: solo https a registry.npmjs.org, registry.yarnpkg.com, pypi.org o files.pythonhosted.org; http → hallazgo).
pases_requeridos = ["check:archivos_clave.lockfile_valido", "check:archivos_clave.lockfile_versionado", "check:archivos_clave.lockfile_ci", "check:archivos_clave.lockfile_hosts"]
evidencia_pass = "checks_pass"
esfuerzo = "S"
fuente = "investigacion/01-fallas-ia-vibecoding.md (VC-11); investigacion/02-seguridad.md (SEC-04)"

[[control]]
id = "SEG-SAST-INY"
titulo = "Sin inyección (NoSQL, comandos, código), XSS, eval ni path traversal"
titulo_dueno = "Hay código que ejecuta o muestra lo que escribe el usuario sin filtrarlo"
accion_dueno = "Revisa cada lugar señalado: valida y escapa los datos en el servidor y usa las funciones propias del framework."
alias = ["VC-09", "SEC-07", "ECO-03"]
dominio = "SEG"
etapa = "E2"
gate = "N2"
severidad_base = "alta"
metodo = "determinista"
herramientas = ["semgrep", "bandit"]
condicion = "siempre"
bloquea_global = false
mapea_reglas = ["semgrep:vibe-coding.eval-dinamico", "semgrep:vibe-coding.comando-concatenado", "semgrep:*xss*", "semgrep:*path-traversal*", "semgrep:*"]
# evidencia_pass: SAST de patrones (p/owasp-top-ten + reglas vibe-coding, cualquier hallazgo semgrep:* cuenta): la ausencia con ≥ 1 archivo fuente analizado es la evidencia de N2; el juicio semántico va en SEG-SAST-TRIAGE. Alcance (ronda 1): paths.scanned de semgrep, solo lenguajes con reglas de inyección y sin código de test (el código de test se escanea, pero no cuenta como alcance).
evidencia_pass = "ausencia_suficiente"
alcance_requerido = ["semgrep.fuentes"]
# Ronda 2: el código escaneado para el que el ruleset cargado no tiene reglas de inyección (Python sin Flask/Django/Pyramid/Lambda, Kotlin, Scala…) bloquea el pass: la ausencia de hallazgos no lo cubre.
alcance_excluyente = [{clave = "semgrep.fuentes_sin_reglas", motivo = "hay código de aplicación escaneado sin reglas de inyección en los rulesets cargados (p. ej. Python sin Flask/Django, Kotlin, Scala): la ausencia de hallazgos no lo cubre"}, {clave = "semgrep.fuentes_no_escaneadas", motivo = "hay código de aplicación que semgrep no escaneó (rutas confidenciales de config/confidencial.toml o archivos > 2 MB): la ausencia de hallazgos no lo cubre (ronda 4, PV-R3-01/04)"}]
# Ronda 3 (PV-R2-06): control_por_regla asigna cada hallazgo de semgrep a UN control; las inyecciones SQL (vibe-coding.sql-concatenado, *sqli*, *tainted-sql*) van a DAT-SQL-CONCATENADO. Si en la misma corrida ese control tiene hallazgos, la propia herramienta encontró una inyección y SEG-SAST-INY no puede quedar en pass (queda no_evaluado; el fail lo lleva DAT-SQL-CONCATENADO, sin duplicar el hallazgo).
pass_contradicho_por = [{control = "DAT-SQL-CONCATENADO", motivo = "semgrep encontró una inyección SQL en la misma corrida (hallazgo de DAT-SQL-CONCATENADO): la ausencia de otros hallazgos de inyección no demuestra que no haya inyección"}]
sin_alcance = "no_aplica"
motivo_sin_alcance = "sin archivos de código fuente (fuera de tests) en lenguajes que cubren las reglas de semgrep"
esfuerzo = "M"
fuente = "investigacion/01-fallas-ia-vibecoding.md (VC-09); investigacion/02-seguridad.md (SEC-07); investigacion/07-repos-skills-expertos.md (ECO-03)"

