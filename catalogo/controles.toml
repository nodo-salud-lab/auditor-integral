[[control]]
id = "DAT-RLS-DENY-ALL"
titulo = "Tablas con RLS activado y sin políticas (deny-all) revisadas como intencionales"
# Ronda 7 (DECISIONES.md #12, adenda 2): rls_estatico emite rls_sin_politicas (severidad info) cuando una tabla expuesta
# tiene RLS activo y ninguna política: niega todo acceso vía API a anon/authenticated (solo service_role entra). No es
# permisivo, así que no va a DAT-RLS-PERMISIVA ni a DAT-RLS-ON; en la ronda 6 quedaba solo en `informativos` del crudo
# y no llegaba a hallazgos.jsonl ni al informe. Aquí es visible con severidad info, sin bloqueo (bloquea_global = false;
# no es crítico) y sin pase: gate N4 porque en DAT ese nivel ya exige DAT-RESTORE (manual), así que su fail no baja el
# nivel demostrado alcanzable en análisis estático. Si la tabla es deny-all a propósito, se descarta como FP verificado.
alias = []
dominio = "DAT"
etapa = "E2"
gate = "N4"
severidad_base = "info"
metodo = "determinista"
herramientas = ["rls_estatico"]
herramientas_parciales = ["rls_estatico"]
# Todas sus herramientas son parciales (fallbacks): permitido solo con evidencia_pass = no_demostrable_estatico
# (test_post_verificacion), que ya garantiza el «nunca pass».
condicion = "baas != 'ninguno'"
bloquea_global = false
mapea_reglas = ["check:rls_estatico.rls_sin_politicas"]
# evidencia_pass: no_demostrable_estatico. Que las migraciones no muestren tablas deny-all no dice nada de la base viva (cambios del dashboard) ni de la intención; sin hallazgos queda no_evaluado, nunca pass.
evidencia_pass = "no_demostrable_estatico"
