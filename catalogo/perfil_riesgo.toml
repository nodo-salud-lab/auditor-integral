# ---------------------------------------------------------------- severidad contextual

[[regla_contextual]]
id = "RLS-ON-DATOS-REALES"
descripcion = "Con BaaS y datos reales cargados, RLS habilitado pasa a ser requisito de N1 (§4.3: RLS-ON* en N1 si hay datos reales)."
condicion = "baas != 'ninguno' and datos_reales_cargados == true"
controles = ["DAT-RLS-ON"]
gate = "N1"
severidad_base = "critica"
bloquea_global = true

[[regla_contextual]]
id = "SALUD-DATOS-REALES-EXPOSICION"
descripcion = "Con datos de salud y datos reales cargados, toda exposición de datos es crítica y bloquea N1 (§3.6)."
condicion = "salud == true and datos_reales_cargados == true"
# DAT-RLS-* de §3.6 se lee como los controles de exposición RLS; DAT-RLS-TESTS (tests en CI)
# no es una exposición y conserva su gate.
controles = ["DAT-RLS-ON", "DAT-RLS-PERMISIVA", "DAT-RLS-SEMANTICA", "DAT-RLS-METADATA", "SEG-IDOR",
             "DAT-BUCKETS", "DAT-ANON-NEGATIVA"]
gate = "N1"
severidad_base = "critica"
bloquea_global = true

[[regla_contextual]]
id = "SALUD-AUDITORIA-ACCESOS"
descripcion = "Con datos de salud, la auditoría de accesos sube a N2 (§3.6; GAP-37)."
condicion = "salud == true"
controles = ["DAT-AUDITORIA-ACCESOS"]
gate = "N2"
