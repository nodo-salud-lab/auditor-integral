# Perfil de riesgo: banderas de perfil.json (PLAN_MAESTRO.md §3.6) → controles
# condicionales, y reglas de severidad contextual.
#
# [[bandera]]
#   nombre     bandera en perfil.json → banderas (schemas/perfil.schema.json)
#   tipo       booleano | enum | entero
#   deteccion  archivos (detectar_stack.py, con confirmación en la entrevista) | entrevista
#   pregunta   número de pregunta de la entrevista E0/E5 que la fija o confirma
#   activa     controles cuya `condicion` depende de esta bandera (patrones fnmatch sobre IDs).
#              Es documentación verificada por tests; la activación real la decide la
#              `condicion` de cada control en controles.toml.
#
# [[regla_contextual]]  (se aplican en orden; solo cuando la condición es verdadera, nunca
#   con banderas sin respuesta: no se asume la respuesta)
#   condicion        expresión con la misma gramática que controles.toml
#   controles        patrones fnmatch sobre IDs
#   severidad_base   nueva severidad (solo puede subir)
#   gate             nuevo gate (solo puede adelantarse a un nivel menor)
#   bloquea_global   true para que el fallo bloquee el nivel global
#
# El auditor señala riesgo; no afirma cumplimiento de la Ley 19.628, la Ley 20.584 ni la
# Ley 21.719 (PLAN_MAESTRO.md §3.6).

