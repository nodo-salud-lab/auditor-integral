# config/umbrales.toml — ADOPTADO el 2026-11-18 (DECISIONES.md #2: "lo más utilizado con evidencia").
# Origen: investigacion/propuestas/umbrales.toml (evidencia verificada en investigacion/12-umbrales-evidencia.md).
# Regla de elección: norma publicada > default de la herramienta más adoptada > propuesta (ESTIMACIÓN).
# Entre alternativas con fuente se adoptó: complejidad ciclomática 15 (lizard), cognitiva 15 (SonarJS S3776,
# 'Sonar way'), Lighthouse performance >= 90 (banda 'Good'), recuperación de despliegue fallido < 24 h (DORA 2024)
# y bandas del IUA alineadas con Lighthouse (0-49 / 50-89 / 90-100). Las alternativas quedan registradas.
#
# origen:
#   "norma"               -> norma, especificación o guía publicada por el organismo/autor de referencia (URL verificable)
#   "default-herramienta" -> valor por defecto documentado (o en el código fuente) de una herramienta ampliamente adoptada
#   "propuesta"           -> ESTIMACIÓN de diseño; la decide el investigador (puede citar evidencia de apoyo, pero no hay un valor estándar)
# verificado = fecha en que se leyó la fuente (2026-11-18).
# Lectores: score.py (cobertura_controles_puntaje) e iua.py (iua_bandas). Los demás los usarán gates/checks
# cuando el catálogo los referencie; se leen siempre por umbral.<clave>.valor, nunca fijados en el código.

# --- Código (COD) -----------------------------------------------------------
[umbral.cobertura_codigo_nuevo]
valor = 80
unidad = "%"
comparacion = ">="
origen = "default-herramienta"
fuente = "https://docs.sonarsource.com/sonarqube-server/10.6/user-guide/quality-gates"
nota = "Quality gate 'Sonar way': 'New code test coverage is greater than or equal to 80.0%'. Antes figuraba como 'norma'; es un default de herramienta."
verificado = "2026-11-18"

[umbral.duplicacion_codigo_nuevo]
valor = 3
unidad = "%"
comparacion = "<="
origen = "default-herramienta"
fuente = "https://docs.sonarsource.com/sonarqube-server/10.6/user-guide/quality-gates"
nota = "Quality gate 'Sonar way': duplicación en código nuevo <= 3,0 %."
verificado = "2026-11-18"

[umbral.cobertura_global]
valor = 60
unidad = "%"
comparacion = ">="
origen = "norma"
fuente = "https://testing.googleblog.com/2020/08/code-coverage-best-practices.html"
nota = "Guía publicada de Google Testing Blog (2020): 60 % 'acceptable', 75 % 'commendable', 90 % 'exemplary'. Google aclara que no es un mandato. El mismo texto sugiere 90 % como límite inferior razonable para cobertura por commit (código que cambia), coherente con el 80 % de Sonar way sobre código nuevo. Se usan 75 y 90 como referencias informativas (cobertura_global_destacable / ejemplar)."
alternativas = ["75 % (commendable, Google)", "90 % (exemplary, Google)"]
verificado = "2026-11-18"

[umbral.cobertura_global_destacable]
valor = 75
unidad = "%"
comparacion = ">="
origen = "norma"
fuente = "https://testing.googleblog.com/2020/08/code-coverage-best-practices.html"
nota = "Informativo (no es compuerta): nivel 'commendable' de la guía de Google. Uso sugerido: mensaje en la hoja de ruta."
verificado = "2026-11-18"

[umbral.duplicacion_global]
valor = 5
unidad = "%"
comparacion = "<="
origen = "propuesta"
fuente = "https://github.com/kucherenko/jscpd (README: ejemplo de GitHub Action con 'threshold: 5'; adoptantes citados en el README usan 4-5 %)"
nota = "ESTIMACIÓN. jscpd no tiene umbral por defecto (Super Linter/MegaLinter usan 0, que el propio README desaconseja). 5 % coincide con el ejemplo oficial de jscpd, pero no es un default. Decide el investigador."
verificado = "2026-11-18"

