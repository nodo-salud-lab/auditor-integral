# --- Escala / SLO (ESC, OPS) -------------------------------------------------
[umbral.latencia_p95_ms]
valor = 500
unidad = "ms (p95 de endpoints de API en prueba de carga promedio)"
comparacion = "<="
origen = "propuesta"
fuente = "https://sre.google/workbook/implementing-slos/"
nota = "NUEVO. ESTIMACIÓN: no existe un p95 estándar de industria. Google SRE Workbook usa como ejemplo '90% of requests < 450 ms' y '99% of requests < 900 ms' para una API; el SLO debe salir del dueño del producto. 500 ms es un valor de diseño para cuando el proyecto no declaró su SLO."
verificado = "2026-11-18"

[umbral.tasa_error_max]
valor = 1
unidad = "% de respuestas 5xx/fallidas en prueba de carga promedio"
comparacion = "<="
origen = "propuesta"
fuente = "https://sre.google/workbook/implementing-slos/"
nota = "NUEVO. ESTIMACIÓN. Ejemplos del SRE Workbook: disponibilidad 97 % (API de ejemplo), 99,9 % (tier Free) y 99,99 % (Premium). No hay valor universal; 1 % (= 99 %) es una elección de diseño entre esos ejemplos."
alternativas = ["3 % (SLO 97 % del ejemplo)", "0,1 % (SLO 99,9 %)"]
verificado = "2026-11-18"

[umbral.recuperacion_despliegue_fallido_h]
valor = 24
unidad = "horas (failed deployment recovery time)"
comparacion = "<"
origen = "norma"
fuente = "https://services.google.com/fh/files/misc/2024_final_dora_report.pdf"
nota = "NUEVO. DORA 2024 (p. 13, clústeres): Elite < 1 hora; High y Medium < 1 día; Low entre 1 semana y 1 mes. < 24 h = alcanzar el clúster Medium/High. Es benchmark de encuesta, no norma; no equivale al RTO de restauración de BD (DAT-RESTORE), que lo declara el dueño."
alternativas = ["1 h (Elite DORA 2024)"]
verificado = "2026-11-18"

