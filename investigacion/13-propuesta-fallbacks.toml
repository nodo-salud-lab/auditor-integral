# ---------------------------------------------------------------------------
# B. Cambios a scripts/doctor.sh: faltan 4 herramientas en CATALOGO.
#    Formato existente: nombre|comando de versión|instalación sugerida|¿npx? (s/n)
# ---------------------------------------------------------------------------
[cambio_doctor]
agregar = [
  "nuclei|nuclei -version|brew install nuclei|n",
  "syft|syft version|brew install syft|n",
  "zap|zap.sh -version|brew install --cask zap (o Docker: ghcr.io/zaproxy/zaproxy:stable zap-baseline.py)|n",
  "psql|psql --version|brew install libpq (para correr splinter.sql contra una conexión de solo lectura)|n",
]
corregir = [
  # La instrucción actual de playwright instala el paquete global; la doc oficial usa @playwright/test por proyecto.
  "playwright|npx playwright --version|npm install -D @playwright/test && npx playwright install chromium|s",
]
mensajes = [
  "trivy falta: la función de dependencias la cubre osv-scanner (instalado); IaC/Dockerfile usan fallback.",
  "actionlint falta: la seguridad de workflows la cubre zizmor (instalado); fallback check_workflows para sintaxis mínima.",
  "lizard: instalar con pipx; `brew install lizard` instala un compresor distinto (formulae.brew.sh/api/formula/lizard.json).",
  "splinter no se instala: usar MCP Supabase get_advisors (solo lectura) o psql -f splinter.sql; si no, fallback estático.",
]
nunca_instalar_sin_confirmacion = true

# ---------------------------------------------------------------------------
# C. Cambios al contrato de checks (scripts/checks/comun.py y normalizar/checks.py)
# ---------------------------------------------------------------------------
[cambio_contrato]
campos_nuevos_en_resultado = ["reemplaza", "cobertura"]   # p. ej. reemplaza = "hadolint", cobertura = "parcial (fallback)"
propagar_a = ["cada hallazgo normalizado", "estado.json del control"]
exclusiones_recorrido_agregar = ["datos-reales", "datos-abiertos"]   # Decisión 3 (kine us herramienta)
regla_pase = "Un fallback marcado `controles_solo_fail` (ux_estatico, presupuesto_build, rls_estatico para DAT-RLS-ON/PERMISIVA) no puede dejar un control en pass; sin hallazgos → no_evaluado (UX) o manual_pendiente (DAT) con aviso de cobertura parcial."
red = "check_humo_http, check_exposicion_http y check_pasivo_http solo con --url declarada y confirmada; solo GET/HEAD; host local o preview confirmado por el creador."

# ---------------------------------------------------------------------------
# D. Cambio a config/umbrales.toml (Decisión 2: preferir defaults ampliamente adoptados)
# ---------------------------------------------------------------------------
[cambio_umbral.complejidad_ciclomatica_max]
valor = 15
origen_actual = "propuesta"
origen_propuesto = "default_herramienta"
fuente_propuesta = "https://github.com/terryyin/lizard/blob/master/lizard_core/options.py (DEFAULT_CCN_THRESHOLD = 15)"
nota = "Verificado con gh api el 2026-11-18. Es un default de herramienta, no una norma."

[cambio_umbral.duplicacion_min_tokens]
valor = 50
origen_propuesto = "default_herramienta"
fuente_propuesta = "https://github.com/kucherenko/jscpd/blob/master/rust/jscpd/README.md (tabla de opciones: --min-tokens default 50)"
nota = "Nuevo umbral para calibrar check_duplicacion igual que jscpd. Corregido en verificación 2026-11-18: la fuente anterior (rust/README.md) solo mostraba 50 en un ejemplo, no como default."

[cambio_umbral.duplicacion_min_lineas]
valor = 5
origen_propuesto = "default_herramienta"
fuente_propuesta = "https://github.com/kucherenko/jscpd/blob/master/rust/jscpd/README.md (tabla de opciones: --min-lines default 5)"
nota = "Agregado en verificación 2026-11-18; antes figuraba como NO VERIFICADO en el informe 13."
