# PROPUESTA (no aplicada) — Decisión 6: herramientas faltantes y fallbacks.
# Fecha: 2026-11-18. Fuente: investigacion/13-fallbacks-herramientas.md.
# Este archivo NO lo lee ningún script. Quien mantiene config/, catalogo/ y scripts/ decide si aplicarlo.
# Todo valor de cobertura es ESTIMACIÓN (no medido); se reemplaza por lo medido en F6 (§5 del informe 13).

# ---------------------------------------------------------------------------
# A. Cambios a catalogo/controles.toml: añadir el fallback al final de `herramientas`
#    (la primera disponible gana) y sus reglas a `mapea_reglas`.
# ---------------------------------------------------------------------------
[[cambio_catalogo]]
control = "COD-DUPLICACION"
herramientas_agregar = ["check_duplicacion"]
mapea_reglas_agregar = ["check:duplicacion.*"]
cobertura_fallback = "~65 % (ESTIMACIÓN)"

[[cambio_catalogo]]
control = "COD-COMPLEJIDAD"
herramientas_agregar = ["check_complejidad"]
herramientas_quitar = ["radon"]   # sin push desde 2024-10-20 (api.github.com/repos/rubik/radon)
mapea_reglas_agregar = ["check:complejidad.*"]
cobertura_fallback = "Python ~95 %, JS/TS ~70 % (ESTIMACIÓN)"

[[cambio_catalogo]]
control = "COD-CICLOS-MUERTO"
herramientas_agregar = ["check_deps_muertas"]
mapea_reglas_agregar = ["check:deps_muertas.*"]
