# PROPUESTA (no activa) de dependencias opcionales de skills/plugins externos.
# Fuente: investigacion/14-skills-externas.md (2026-11-18). DECISIÓN 7.
# Verificado por revisor escéptico el 2026-11-18 (gh api): rutas, commits y licencias coinciden; ver §Verificación del informe 14.
# Este archivo NO está en config/: lo revisa el investigador y, si lo aprueba,
# el proceso de construcción lo mueve o adapta a config/skills_externas.toml.
#
# Campos:
#   repo, ruta, commit_verificado (main al 2026-11-18 vía gh api), licencia
#   puntaje_senal   = total del ranking §4 (ESTIMACIÓN de diseño; fórmula en §2)
#   controles       = IDs de catalogo/controles.toml que complementa (no reemplaza)
#   disparo         = condición sobre perfil.json / hallazgos normalizados
#   modo            = "subagente" | "referencia" (leer archivo puntual) | "externo" (corre fuera, se ingiere su salida)
#   salida          = contrato que recibe el hilo principal
#   tope_hallazgos  = propuesta
#   costo_tokens    = ESTIMACIÓN cualitativa (bajo|medio|alto), medir en el piloto
#   requiere_confirmacion = true si gasta mucho o envía datos fuera
#   instalado_local = estado al 2026-11-18

[global]
datos_excluidos = ["datos-reales/", "datos-abiertos/"]   # DECISIÓN 3: nunca entran a una skill
descubrimiento = "solo installed_plugins.json + línea name: del frontmatter; nunca cargar el cuerpo en doctor"
sin_dependencia = "el control usa su herramienta determinista o fallback y declara cobertura = 'parcial (fallback)'"
registrar_version_en_informe = true

# ---------------- Prioridad alta ----------------

[skill.fp-check]
repo = "trailofbits/skills"
ruta = "plugins/fp-check"
version_local = "1.0.5"
licencia = "CC-BY-SA-4.0"
puntaje_senal = 71.0
controles = ["SEG-SAST-TRIAGE"]
disparo = "hallazgo.severidad in ['critica','alta'] and hallazgo.metodo == 'determinista'"
modo = "subagente"
salida = "jsonl {fingerprint, veredicto: TRUE_POSITIVE|FALSE_POSITIVE|INCIERTO, razon<=40 palabras}"
entrada = "hallazgo + 20 líneas de contexto"
tope_hallazgos = 20
costo_tokens = "medio"
requiere_confirmacion = false
instalado_local = true

